name: capnpc_dart
description: Cap'n Proto code generator plugin for Dart. Receives a CodeGeneratorRequest from the capnp compiler and generates typed Dart source files.
version: 0.2.0
repository: https://github.com/AngryMane/capnproto-dart
issue_tracker: https://github.com/AngryMane/capnproto-dart/issues
documentation: https://angrymane.github.io/capnproto-dart/
topics: [capnproto, code-generation]

resolution: workspace

executables:
  capnpc-dart: capnpc_dart

environment:
  sdk: ^3.7.2

dependencies:
  capnproto_dart: ^0.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
